<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>宍戸組 申請システム</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP",
                   "Hiragino Kaku Gothic ProN", "Yu Gothic", Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      color: #111;
    }

    .box {
      max-width: 600px;
      margin: 80px auto;
      background: #fff;
      border-radius: 18px;
      padding: 40px 25px;
      box-sizing: border-box;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    .title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .status {
      font-size: 22px;
      line-height: 1.6;
    }

    .error {
      margin-top: 25px;
      color: #d00;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="title">宍戸組 申請システム</div>
    <div id="status" class="status">
      LINE認証を確認しています…
    </div>
    <div id="error" class="error"></div>
  </div>

  <script>
    const LIFF_ID = '2011785712-iKJrxFMX';

    const GAS_URL =
      'https://script.google.com/macros/s/AKfycbyIjanUwmqXixwUluYrBgHwFZDR15s3LauimFjcWwkWJAWduEnlfK7SZkuCnrIrpk/exec';


    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }


    function setError(text) {
      document.getElementById('error').textContent = text;
    }


    function getPage() {
      const params =
        new URLSearchParams(window.location.search);

      const page =
        params.get('page');

      if (
        page === 'transport' ||
        page === 'daily' ||
        page === 'report' ||
        page === 'expense'
      ) {
        return page;
      }

      return 'transport';
    }


    async function start() {

      try {

        setStatus('LINEを初期化しています…');

        await liff.init({
          liffId: LIFF_ID,
          withLoginOnExternalBrowser: true
        });


        setStatus('LINE認証情報を取得しています…');


        const idToken =
          liff.getIDToken();


        if (!idToken) {
          throw new Error(
            'LINE IDトークンを取得できませんでした。'
          );
        }


        const page =
          getPage();


        /*
         * IDトークンはURLのハッシュ部分に入れます。
         * ハッシュはサーバーへ送信されません。
         */
        const gasUrl =
          GAS_URL +
          '?page=' +
          encodeURIComponent(page) +
          '#id_token=' +
          encodeURIComponent(idToken);


        setStatus('申請システムを開いています…');


        window.location.replace(gasUrl);

      }
      catch (error) {

        setStatus('エラーが発生しました。');

        setError(
          error && error.message
            ? error.message
            : String(error)
        );

      }

    }


    start();
  </script>

</body>
</html>
